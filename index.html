<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, maximum-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet" />
  <title>restricted</title>
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
  <style>
    html, body { height: 100%; margin: 0; background: #000; }
    body { display: flex; align-items: center; justify-content: center; font-family: ui-monospace, Consolas, monospace; color: #e8e8e8; }
    form { display: flex; flex-direction: column; gap: 12px; width: min(320px, 86vw); }
    .label { font-size: 13px; letter-spacing: 2px; text-transform: uppercase; opacity: .6; }
    input { padding: 12px 14px; background: #111; border: 1px solid #333; color: #fff; border-radius: 8px; font-size: 16px; outline: none; }
    input:focus { border-color: #666; }
    button { padding: 12px; background: #e8e8e8; color: #000; border: 0; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; letter-spacing: 1px; }
    button:hover { background: #fff; }
    #err { min-height: 16px; font-size: 12px; color: #ff5c5c; margin: 0; }
  </style>
</head>
<body>
  <form id="f">
    <div class="label">restricted</div>
    <input id="p" type="password" inputmode="numeric" autocomplete="off" placeholder="password" autofocus>
    <button type="submit">ENTER</button>
    <p id="err"></p>
  </form>
  <script>
    (function () {
      var HASH = 'c0fabcf7370b8c37f6c9186bcc5b4ffe6bd62496a08b8b5c3cd623ba3497c9c4';
      var form = document.getElementById('f');
      var input = document.getElementById('p');
      var err = document.getElementById('err');
      function hex(buf) {
        return Array.prototype.map.call(new Uint8Array(buf), function (b) {
          return ('0' + b.toString(16)).slice(-2);
        }).join('');
      }
      function check(value) {
        if (!(window.crypto && crypto.subtle)) return Promise.resolve(false);
        return crypto.subtle.digest('SHA-256', new TextEncoder().encode(value)).then(function (buf) {
          return hex(buf) === HASH;
        });
      }
      try {
        if (sessionStorage.getItem('rc_ok') === '1') { location.replace('./game.html'); }
      } catch (e) {}
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var value = input.value.trim();
        if (!value) return;
        check(value).then(function (ok) {
          if (ok) {
            try { sessionStorage.setItem('rc_ok', '1'); } catch (e) {}
            location.replace('./game.html');
          } else {
            err.textContent = 'wrong password';
            input.value = '';
            input.focus();
          }
        });
      });
      input.focus();
    })();
  </script>
</body>
</html>
